apiVersion: apps/v1
kind: Deployment
metadata:
  name: global-30x30
  namespace: biodiversity
  labels:
    app: global-30x30
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: global-30x30
  template:
    metadata:
      labels:
        app: global-30x30
    spec:
      initContainers:
      - name: git-clone
        image: alpine/git:2.52.0
        command:
        - sh
        - -c
        - |
          # Clone YOUR app repo (the GitHub repo you created from the template).
          # Update this URL to point to your own GitHub repo:
          # Update this URL to point to your own GitHub repo:
          git clone --depth 1 https://github.com/boettiger-lab/global-30x30.git /tmp/repo
          cp /tmp/repo/index.html /usr/share/nginx/html/
          cp /tmp/repo/docs.html /usr/share/nginx/html/
          cp /tmp/repo/layers-input.json /usr/share/nginx/html/
          cp /tmp/repo/system-prompt.md /usr/share/nginx/html/
          cp -r /tmp/repo/sdm /usr/share/nginx/html/
          cp -r /tmp/repo/iucn /usr/share/nginx/html/
          # The shared nginx snippets (glen-ops#340), pinned like the GLEN version.
          git clone --depth 1 --branch nginx-v2 https://github.com/SchmidtDSE/glen-template.git /tmp/glen
          cp /tmp/glen/nginx/* /glen-nginx/
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: glen-nginx
          mountPath: /glen-nginx
      containers:
      - name: nginx
        image: nginx:1.31.9-alpine
        ports:
        - containerPort: 80
        env:
        - name: TMPDIR
          value: "/tmp"
        # Per-app values for the shared nginx snippets (glen-template nginx/render.sh).
        - name: GLEN_APP
          value: "global-30x30"
        - name: LLM_UPSTREAM
          value: "http://open-llm-proxy.biodiversity.svc.cluster.local:8002"
        - name: MCP_UPSTREAM
          value: "http://mcp-server-duckdb.biodiversity.svc.cluster.local:8000"
        - name: MCP_HOST
          value: "duckdb-mcp.nrp-nautilus.io"
        - name: MCP_TILES_SOURCE
          value: "https://duckdb-mcp.nrp-nautilus.io/tiles/"
        - name: APP_NGINX_VARS
          value: '${SDM_AUTH_TOKEN}'
        - name: CONFIG_JSON_COPIES
          value: '/usr/share/nginx/html/iucn/config.json'
        # Same-origin MCP path: nginx proxies it to the shared server and
        # attaches the bearer token, so the browser never holds the token
        # (geo-query#453). Absolute, because GLEN does new URL(mcp_url).
        - name: MCP_SERVER_URL
          value: "https://global-30x30.nrp-nautilus.io/api/mcp"
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: duckdb-mcp-auth
              key: MCP_AUTH_TOKEN
        # This app's key in the hexsdm server's token Secret; nginx attaches it
        # on /api/sdm.
        - name: SDM_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: sdm-mcp-tokens
              key: global-30x30
        - name: LLM_ENDPOINT
          value: "https://open-llm-proxy.nrp-nautilus.io/v1"
        - name: PROXY_KEY
          valueFrom:
            secretKeyRef:
              name: open-llm-proxy-app-keys
              key: global-30x30
        # Renders the shared snippets and this app's server block, writes
        # config.json, and starts nginx.
        command: ["sh", "/glen-nginx/render.sh"]
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        volumeMounts:
        - name: website-content
          mountPath: /usr/share/nginx/html
        - name: nginx-template
          mountPath: /nginx-template
          readOnly: true
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: glen-nginx
          mountPath: /glen-nginx
          readOnly: true
        - name: config-template
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
      volumes:
      - name: website-content
        emptyDir: {}
      - name: config-template
        configMap:
          name: global-30x30-config
      - name: nginx-template
        configMap:
          name: global-30x30-nginx
      - name: nginx-conf-d
        emptyDir: {}
      - name: glen-nginx
        emptyDir: {}
