# LLM config template — NO SECRETS.
#
# The upstream LLM proxy key lives only in the nginx config (see
# `global-30x30-nginx` below), which injects the Authorization header
# server-side via `proxy_set_header`. The browser only sees a relative
# `/api/llm` endpoint and never holds the key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-30x30-config
  namespace: biodiversity
data:
  config.template.json: |
    {
        "mcp_server_url": "${MCP_SERVER_URL}",
        "llm_model": "deepseek-v4-flash",
        "transcription_model": {
            "value": "gemma-small",
            "endpoint": "/api/llm",
            "api_key": "unused"
        },
        "llm_models": [
            {
                "value": "deepseek-v4-flash",
                "label": "NRP DeepSeek V4 Flash",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "glm-5",
                "label": "NRP GLM-5.2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "kimi",
                "label": "NRP Kimi",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3",
                "label": "NRP Qwen3",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "qwen3-small",
                "label": "NRP Qwen3 Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gpt-oss",
                "label": "NRP GPT-OSS 120B",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "minimax-m2",
                "label": "NRP MiniMax M2",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma",
                "label": "NRP Gemma",
                "endpoint": "/api/llm",
                "api_key": "unused"
            },
            {
                "value": "gemma-small",
                "label": "NRP Gemma Small",
                "endpoint": "/api/llm",
                "api_key": "unused"
            }
        ]
    }

---
# Nginx configuration. The shared parts (limits, chat, MCP, tiles, the page and
# the health check) are the snippets in nginx/ of SchmidtDSE/glen-template at the
# tag the Deployment clones, filled in from its env at start-up (glen-ops#340).
# Only this app's own routes belong here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: global-30x30-nginx
  namespace: biodiversity
data:
  nginx.conf.template: |
    include /etc/nginx/glen/limits.conf;

    server {
        listen 80;
        server_name _;

        include /etc/nginx/glen/base.conf;
        include /etc/nginx/glen/llm.conf;
        include /etc/nginx/glen/mcp.conf;
        include /etc/nginx/glen/spa.conf;

        # Reverse proxy to the hexsdm MCP server (sdm-mcp), which requires a
        # bearer token like geo-query. nginx attaches this app's token from
        # SDM_AUTH_TOKEN so the browser never holds it.
        # Proxies the in-cluster Service. Result files and map layers are
        # public on s3-west public-output (30-day scratch).
        location /api/sdm {
            proxy_set_header X-Real-IP $client_addr;
            limit_req zone=mcp burst=120 nodelay;
            proxy_pass http://sdm-mcp.biodiversity.svc.cluster.local:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Authorization "Bearer ${SDM_AUTH_TOKEN}";
            proxy_set_header X-Glen-App "${GLEN_APP}";
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }

        # The IUCN species explorer lives in /iucn/; a relative redirect keeps https.
        location = /iucn {
            absolute_redirect off;
            return 301 /iucn/;
        }
    }
